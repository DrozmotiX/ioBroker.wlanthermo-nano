# Dependabot will run on day 7 of each month at 01:58 (Europe/Berlin timezone)
version: 2
updates:

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "58 1 7 * *"
    open-pull-requests-limit: 20
    assignees:
      - "DrozmotiX"
    versioning-strategy: "increase"
